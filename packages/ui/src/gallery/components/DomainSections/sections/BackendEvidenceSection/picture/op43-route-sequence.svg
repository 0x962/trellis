<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
	<title>The call path of the private Canary route</title>
	<defs>
		<marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M0 0 L8 4 L0 8 z" fill="#9198a1" />
		</marker>
	</defs>
	<g fill="none" stroke="#9198a1" stroke-width="1">
		<rect x="20" y="12" width="140" height="30" rx="4" />
		<rect x="290" y="12" width="140" height="30" rx="4" />
		<rect x="550" y="12" width="140" height="30" rx="4" />
		<path d="M90 46 L90 280" stroke-dasharray="4 4" />
		<path d="M360 46 L360 280" stroke-dasharray="4 4" />
		<path d="M620 46 L620 280" stroke-dasharray="4 4" />
		<path d="M90 100 L356 100" marker-end="url(#head)" />
		<path d="M360 155 L616 155" marker-end="url(#head)" />
		<path d="M620 210 L364 210" marker-end="url(#head)" stroke-dasharray="6 4" />
		<path d="M360 265 L94 265" marker-end="url(#head)" stroke-dasharray="6 4" />
	</g>
	<g fill="#9198a1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
		<text x="90" y="32" text-anchor="middle">Operator</text>
		<text x="360" y="32" text-anchor="middle">Canary</text>
		<text x="620" y="32" text-anchor="middle">Postgres</text>
		<text x="96" y="92">GET /api/private/staff-hotels?user=&lt;uuid&gt;</text>
		<text x="366" y="147">select the hotels of that user</text>
		<text x="614" y="202" text-anchor="end">the hotel rows</text>
		<text x="354" y="257" text-anchor="end">200 {properties: [...]}</text>
	</g>
</svg>
