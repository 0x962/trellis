<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-__SCRIPT_HASH__'" />
		<title>Trellis</title>
		<style>
/* __TOKENS__ */
			* { box-sizing: border-box; }
			body {
				margin: 0;
				height: 100vh;
				display: grid;
				align-items: center;
				padding: 16px;
				color: var(--fg);
				font-family: var(--sans);
				-webkit-font-smoothing: antialiased;
			}
			main {
				padding: 24px;
				background: var(--bg);
				border: 1px solid var(--border-strong);
				border-radius: 12px;
				box-shadow: var(--shadow-md);
				opacity: 0;
				transform: translateY(4px);
				transition: opacity 160ms ease-out, transform 160ms ease-out;
				-webkit-app-region: drag;
			}
			[data-visible] main { opacity: 1; transform: translateY(0); }
			.title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
			h1 { margin: 0; font-size: 16px; font-weight: 500; }
			#steps { flex: none; color: var(--fg-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
			#stage { height: 20px; margin: 8px 0 20px; color: var(--fg-muted); font-size: 13px; line-height: 20px; }
			.track { height: 4px; overflow: hidden; border-radius: 3px; background: var(--border); }
			.fill { height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 240ms ease-out; }
			#remaining { margin: 12px 0 0; color: var(--fg-muted); font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; }
			@media (prefers-reduced-motion: reduce) {
				main, .fill { transition: none; transform: none; }
			}
		</style>
	</head>
	<body>
		<main aria-label="Trellis startup">
			<div role="status" aria-live="polite" aria-atomic="true">
				<div class="title"><h1 id="phase">Prepare app</h1><span id="steps">Step 1/3</span></div>
				<p id="stage">Check installed app</p>
			</div>
			<div class="track" role="progressbar" aria-label="Completed startup steps" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div>
			<p id="remaining" aria-live="off">Estimating time remaining…</p>
		</main>
		<script>
			const panel = document.querySelector("main");
			const fill = document.querySelector(".fill");
			const bar = document.querySelector('[role="progressbar"]');
			let current;
			const remaining = () => {
				let text = "Estimating time remaining…";
				if (current?.progress === 1) text = "Ready";
				else if (current?.remainingMs !== null && current && Date.now() <= current.estimateExpiresAt) {
					const seconds = Math.max(5, Math.ceil((current.remainingMs - (Date.now() - current.updatedAt)) / 5000) * 5);
					text = seconds >= 60 ? `About ${Math.ceil(seconds / 60)} min remaining` : `About ${seconds} sec remaining`;
				} else if (current) {
					// The estimate for this step has run out. Show the step and the time it has taken, so a slow step is visible.
					const seconds = Math.floor((Date.now() - current.updatedAt) / 1000);
					text = `${current.stage}: ${seconds >= 60 ? `${Math.floor(seconds / 60)} min ${seconds % 60} sec` : `${seconds} sec`} so far`;
				}
				document.getElementById("remaining").textContent = text;
			};
			const transition = async (visible) => {
				await new Promise(requestAnimationFrame);
				await new Promise(requestAnimationFrame);
				document.documentElement.toggleAttribute("data-visible", visible);
				await Promise.all(panel.getAnimations().map((animation) => animation.finished));
			};
			window.trellisProgress = {
				update(data) {
					current = data;
					document.getElementById("phase").textContent = data.phase;
					document.getElementById("steps").textContent = `Step ${data.step}/${data.total}`;
					document.getElementById("stage").textContent = data.stage === data.phase ? "" : data.stage;
					fill.style.transform = `scaleX(${data.progress})`;
					bar.setAttribute("aria-valuenow", String(Math.round(data.progress * 100)));
					bar.setAttribute("aria-valuetext", `Step ${data.step} of ${data.total}: ${data.phase}`);
					remaining();
				},
				appear: () => transition(true),
				disappear: () => transition(false),
				settle: () => Promise.all(fill.getAnimations().map((animation) => animation.finished)),
			};
			setInterval(remaining, 1000);
		</script>
	</body>
</html>
