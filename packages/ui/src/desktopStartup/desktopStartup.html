<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-__SCRIPT_HASH__'" />
		<title>Trellis</title>
		<style>
/* __TOKENS__ */
			* { box-sizing: border-box; }
			body { margin: 0; padding: 28px 32px; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
			h1 { margin: 0 0 20px; font-size: 14px; font-weight: 600; }
			.stage { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 16px; font-weight: 500; }
			.indicator { width: 16px; height: 16px; flex: none; border: 2px solid var(--border-strong); border-top-color: var(--fg); border-right-color: var(--fg); border-radius: 50%; }
			p { margin: 12px 0 0; color: var(--fg-muted); font-size: 13px; line-height: 20px; }
			#elapsed { margin-top: 20px; font-size: 12px; font-variant-numeric: tabular-nums; }
		</style>
	</head>
	<body>
		<main>
			<h1>Trellis</h1>
			<div class="stage" role="status" aria-live="polite" aria-atomic="true">
				<span class="indicator" aria-hidden="true"></span>
				<span id="stage">Prepare Trellis</span>
			</div>
			<p>The app opens when these steps finish.</p>
			<p id="elapsed" role="timer" aria-live="off">Elapsed: 0:00</p>
		</main>
		<script>
			const started = performance.now();
			setInterval(() => {
				const seconds = Math.floor((performance.now() - started) / 1000);
				document.getElementById("elapsed").textContent = `Elapsed: ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
			}, 1000);
		</script>
	</body>
</html>
