name: Linux process lifecycle

on:
  push:
    branches:
      - trellis/trl-1623-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: lifecycle (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Describe the host
        run: |
          uname -a
          grep PRETTY_NAME /etc/os-release
          ldd --version | head -n 1
          node --version
          id
          stat -fc %T /sys/fs/cgroup
          cat /proc/self/cgroup
      - name: Unit tests
        working-directory: apps/runtime
        run: bun test src/platform
      # The job runs in the cgroup of the runner service, which root owns.
      - name: Refused launch without cgroup delegation
        working-directory: apps/runtime
        env:
          TRELLIS_EXPECT_LINUX_REFUSAL: "1"
          TRELLIS_LINUX_PROOF: ${{ runner.temp }}/proof/refusal.json
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          bun test src/platform/linux/linuxLifecycle.process.test.ts
      # A lingering user starts a systemd user manager. `systemd-run --user
      # --scope -p Delegate=yes` gives the test process a cgroup subtree that
      # this user owns. Neither step needs a privileged container.
      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          for attempt in $(seq 1 100); do
            if [ -S "$runtime_dir/systemd/private" ]; then break; fi
            sleep 0.1
          done
          test -S "$runtime_dir/systemd/private"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
      - name: Real process cases in a delegated cgroup
        working-directory: apps/runtime
        env:
          TRELLIS_REQUIRE_LINUX_LIFECYCLE: "1"
          TRELLIS_LINUX_PROOF: ${{ runner.temp }}/proof/lifecycle.json
        run: |
          systemd-run --user --scope --quiet -p Delegate=yes -- sh -c 'cat /proc/self/cgroup; exec bun test src/platform/linux/linuxLifecycle.process.test.ts'
          cat "$TRELLIS_LINUX_PROOF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-process-lifecycle-${{ matrix.runner }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
