name: Storybook

on:
  pull_request:
    paths:
      - apps/web/**
      - packages/ui/**
      - packages/api/**
      - package.json
      - bun.lock
      - tsconfig.base.json
      - .github/workflows/storybook.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run storybook:check
      - run: bun run storybook:typecheck
      - run: bunx biome check apps/web/.storybook apps/web/scripts/storybook apps/web/src/stories
      - run: bun test apps/web/src/stories/support/createStoryClient/createStoryClient.test.ts apps/web/scripts/storybook/installStoryObserver.test.ts
      - run: bun run storybook:build
      - run: bunx playwright install --with-deps chromium
      - name: Check every story in the static build
        run: |
          bun run storybook:serve > storybook-server.log 2>&1 &
          storybook_pid=$!
          trap 'kill "$storybook_pid"; wait "$storybook_pid" || true' EXIT
          curl --fail --silent --output /dev/null --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:6006/index.json
          STORYBOOK_RESULTS=storybook-results.json bun run storybook:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: storybook-checks
          path: |
            storybook-server.log
            storybook-results.json
          if-no-files-found: ignore
