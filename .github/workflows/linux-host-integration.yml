name: Linux host integration

on:
  push:
    branches:
      - integration/linux-host
      - integration/linux-connection
      - integration/linux-client
      - integration/linux-operations
      - integration/linux-verification
      - integration/linux-system

permissions:
  contents: read

concurrency:
  group: linux-integration-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.13

jobs:
  plan:
    name: Plan / Select integration lane
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: plan
        name: Select the lane and record identity
        run: bun scripts/linux-integration/plan.ts
      - name: Upload the plan result
        if: ${{ always() && steps.plan.outputs.result_artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.result_artifact }}
          path: |
            evidence/plan.json
            evidence/results/plan-identity-linux-x64.json
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint / Repository
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: check
        name: Run the repository lint
        run: bun scripts/linux-integration/run.ts lint-repository linux-x64 ubuntu-24.04
      - name: Upload the lint result
        if: ${{ always() && steps.check.outputs.result_artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.check.outputs.result_artifact }}
          path: evidence/results/lint-repository-linux-x64.json
          if-no-files-found: error
          retention-days: 14

  typecheck:
    name: Typecheck / ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: check
        name: Run both type checks
        run: bun scripts/linux-integration/run.ts typecheck ${{ matrix.platform }} ${{ matrix.runner }}
      - name: Upload the typecheck result
        if: ${{ always() && steps.check.outputs.result_artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.check.outputs.result_artifact }}
          path: evidence/results/typecheck-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  focused_tests:
    name: Test / ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: check
        name: Run the approved focused tests
        run: bun scripts/linux-integration/run.ts focused-tests ${{ matrix.platform }} ${{ matrix.runner }}
      - name: Upload the focused test result
        if: ${{ always() && steps.check.outputs.result_artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.check.outputs.result_artifact }}
          path: evidence/results/focused-tests-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package / ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: check
        name: Run the approved package command
        run: bun scripts/linux-integration/run.ts package ${{ matrix.platform }} ${{ matrix.runner }}
      - name: Upload the package result
        if: ${{ always() && steps.check.outputs.result_artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.check.outputs.result_artifact }}
          path: evidence/results/package-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload the package files
        if: ${{ always() && steps.check.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.check.outputs.package_artifact }}
          path: evidence/package/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke / ${{ matrix.platform }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform:
          - debian-x64
          - rocky-x64
          - alpine-x64
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: check
        name: Run the approved bounded container smoke check
        run: bun scripts/linux-integration/run.ts smoke ${{ matrix.platform }} ubuntu-24.04
      - name: Upload the smoke result
        if: ${{ always() && steps.check.outputs.result_artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.check.outputs.result_artifact }}
          path: evidence/results/smoke-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  latitude:
    name: Latitude / protected-x64
    if: ${{ vars.TRELLIS_LATITUDE_ENABLED == 'true' }}
    needs: plan
    environment: linux-latitude
    runs-on:
      - self-hosted
      - linux
      - x64
      - trellis-latitude
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: check
        name: Run the approved Latitude command
        run: bun scripts/linux-integration/run.ts latitude protected-x64 self-hosted-linux-x64-trellis-latitude
      - name: Upload the Latitude result
        if: ${{ always() && steps.check.outputs.result_artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.check.outputs.result_artifact }}
          path: evidence/results/latitude-protected-x64.json
          if-no-files-found: error
          retention-days: 14

  evidence:
    name: Evidence / Index
    if: ${{ always() }}
    needs:
      - plan
      - lint
      - typecheck
      - focused_tests
      - package
      - smoke
      - latitude
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Download each result artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trellis-ci-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: evidence/downloaded
          merge-multiple: true
      - id: index
        name: Build the evidence index
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.focused_tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          LATITUDE_RESULT: ${{ needs.latitude.result }}
        run: bun scripts/linux-integration/index.ts evidence/downloaded evidence/index
      - name: Upload the full evidence index
        if: ${{ always() && steps.index.outputs.artifact != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.index.outputs.artifact }}
          path: evidence/index
          if-no-files-found: error
          retention-days: 14
      - name: Keep proof gaps release-blocking
        if: ${{ steps.index.outputs.complete != 'true' }}
        run: exit 1
