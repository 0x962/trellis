name: Bug
description: Something in trellis does not do what the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        An issue is public. Your tickets are not.
        Redact every ticket title, project name, repository path, and file path
        before you paste output from `trellis status` or `~/.trellis/server.log`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: State what you did, what you expected, and what trellis did instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `trellis status`
      description: Redact the ticket titles and the paths first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from `~/.trellis/server.log`
      description: Redact the ticket titles and the paths first.
      render: shell
