<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2200" viewBox="0 0 1280 2200" role="img" aria-labelledby="title desc"><title id="title">Trellis desktop screen concepts</title><desc id="desc">Three proposed screens: an attention queue, a ticket with output evidence, and a project manager with a durable queue. All displayed data is illustrative.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="2200" rx="0" fill="#f0f1f2" stroke="none"/><text x="40" y="37" font-size="22" fill="#24272b" font-weight="600">Trellis desktop / screen concepts</text><text x="40" y="62" font-size="13" fill="#666d75" font-weight="400">Proposed layouts. Illustrative data. Controls are not interactive.</text><text x="40" y="96" font-size="17" fill="#24272b" font-weight="600">01 / Needs you</text><text x="40" y="121" font-size="13" fill="#666d75" font-weight="400">The next decision comes first. Each row opens its ticket and relevant output.</text><g transform="translate(40 139)"><rect x="0" y="0" width="1200" height="600" rx="12" fill="#ffffff" stroke="#dfe2e5"/><rect x="0" y="0" width="204" height="600" rx="12" fill="#f5f6f7" stroke="#dfe2e5"/><text x="26" y="33" font-size="19" fill="#24272b" font-weight="650">trellis</text><circle cx="24" cy="59" r="4" fill="#b4b9bf"/><circle cx="40" cy="59" r="4" fill="#c4c8cd"/><circle cx="56" cy="59" r="4" fill="#d2d5d9"/><rect x="12" y="88" width="180" height="34" rx="6" fill="#e5e8eb" stroke="none"/><text x="27" y="112" font-size="14" fill="#24272b" font-weight="600">Needs you</text><text x="27" y="154" font-size="14" fill="#24272b" font-weight="400">All tickets</text><text x="27" y="196" font-size="14" fill="#24272b" font-weight="400">Reviews</text><text x="27" y="238" font-size="14" fill="#24272b" font-weight="400">Flows</text><text x="27" y="305" font-size="11" fill="#666d75" font-weight="600">PROJECTS</text><text x="27" y="340" font-size="14" fill="#24272b" font-weight="600">Trellis</text><text x="42" y="377" font-size="14" fill="#24272b" font-weight="400">Tickets</text><text x="42" y="411" font-size="14" fill="#24272b" font-weight="400">Manager</text><text x="42" y="445" font-size="14" fill="#24272b" font-weight="400">Settings</text><path d="M20 540h164" stroke="#dfe2e5"/><text x="27" y="567" font-size="12" fill="#666d75" font-weight="400">Local runtime connected</text><text x="230" y="34" font-size="16" fill="#24272b" font-weight="600">Needs you</text><text x="230" y="59" font-size="12" fill="#666d75" font-weight="400">3 decisions across 2 projects</text><path d="M204 78h996" stroke="#dfe2e5"/><text x="236" y="118" font-size="12" fill="#666d75" font-weight="600">Answer</text><rect x="230" y="134" width="940" height="98" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="250" y="163" font-size="17" fill="#24272b" font-weight="600">TRL-124   Folder access required</text><text x="250" y="190" font-size="14" fill="#666d75" font-weight="400">Gus cannot start the assigned check until you approve this repository.</text><text x="250" y="215" font-size="12" fill="#666d75" font-weight="400">Waiting for input · 2 minutes · No work started</text><circle cx="1138" cy="180" r="15" fill="white" stroke="#dfe2e5"/><path d="M1133 180h10 l-4 -4 M1143 180l-4 4" stroke="#24272b" fill="none"/><text x="236" y="268" font-size="12" fill="#666d75" font-weight="600">Review output</text><rect x="230" y="284" width="940" height="114" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="250" y="315" font-size="17" fill="#24272b" font-weight="600">TRL-121   Preserve the draft after a reload</text><text x="250" y="344" font-size="14" fill="#24272b" font-weight="400">3 changed files · 8 checks passed · Review revision 4</text><text x="250" y="375" font-size="13" fill="#666d75" font-weight="400">Tess requests review of the local changes.</text><circle cx="1138" cy="337" r="15" fill="white" stroke="#dfe2e5"/><path d="M1133 337h10 l-4 -4 M1143 337l-4 4" stroke="#24272b" fill="none"/><text x="236" y="434" font-size="12" fill="#666d75" font-weight="600">Inspect a failure</text><rect x="230" y="450" width="940" height="104" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="250" y="481" font-size="17" fill="#24272b" font-weight="600">OP-18   Conversation unavailable</text><text x="250" y="509" font-size="14" fill="#666d75" font-weight="400">The workspace and output remain available. Resume needs a decision.</text><text x="250" y="534" font-size="12" fill="#666d75" font-weight="400">Interrupted · 14 minutes</text><circle cx="1138" cy="499" r="15" fill="white" stroke="#dfe2e5"/><path d="M1133 499h10 l-4 -4 M1143 499l-4 4" stroke="#24272b" fill="none"/></g><text x="40" y="796" font-size="17" fill="#24272b" font-weight="600">02 / Ticket workspace</text><text x="40" y="821" font-size="13" fill="#666d75" font-weight="400">Keep the ticket beside its output. The terminal stays available without taking over the page.</text><g transform="translate(40 839)"><rect x="0" y="0" width="1200" height="600" rx="12" fill="#ffffff" stroke="#dfe2e5"/><rect x="0" y="0" width="204" height="600" rx="12" fill="#f5f6f7" stroke="#dfe2e5"/><text x="26" y="33" font-size="19" fill="#24272b" font-weight="650">trellis</text><circle cx="24" cy="59" r="4" fill="#b4b9bf"/><circle cx="40" cy="59" r="4" fill="#c4c8cd"/><circle cx="56" cy="59" r="4" fill="#d2d5d9"/><text x="27" y="112" font-size="14" fill="#24272b" font-weight="400">Needs you</text><text x="27" y="154" font-size="14" fill="#24272b" font-weight="400">All tickets</text><text x="27" y="196" font-size="14" fill="#24272b" font-weight="400">Reviews</text><text x="27" y="238" font-size="14" fill="#24272b" font-weight="400">Flows</text><text x="27" y="305" font-size="11" fill="#666d75" font-weight="600">PROJECTS</text><text x="27" y="340" font-size="14" fill="#24272b" font-weight="600">Trellis</text><rect x="22" y="355" width="170" height="32" rx="6" fill="#e5e8eb" stroke="none"/><text x="42" y="377" font-size="14" fill="#24272b" font-weight="600">Tickets</text><text x="42" y="411" font-size="14" fill="#24272b" font-weight="400">Manager</text><text x="42" y="445" font-size="14" fill="#24272b" font-weight="400">Settings</text><path d="M20 540h164" stroke="#dfe2e5"/><text x="27" y="567" font-size="12" fill="#666d75" font-weight="400">Local runtime connected</text><text x="230" y="34" font-size="16" fill="#24272b" font-weight="600">Trellis / TRL-121</text><text x="230" y="59" font-size="12" fill="#666d75" font-weight="400">Back to Trellis tickets · Filter: Assigned to agents</text><path d="M204 78h996" stroke="#dfe2e5"/><circle cx="1100" cy="37" r="15" fill="white" stroke="#dfe2e5"/><path d="M1095 37h10 M1100 32v10" stroke="#24272b"/><circle cx="1148" cy="37" r="15" fill="white" stroke="#dfe2e5"/><circle cx="1143" cy="37" r="1.5"/><circle cx="1148" cy="37" r="1.5"/><circle cx="1153" cy="37" r="1.5"/><text x="232" y="118" font-size="23" fill="#24272b" font-weight="600">Preserve the draft after a reload</text><text x="232" y="146" font-size="13" fill="#666d75" font-weight="400">Ready for review · Local changes · Updated 2 minutes ago</text><rect x="230" y="172" width="335" height="361" rx="7" fill="#f5f6f7" stroke="#dfe2e5"/><text x="248" y="203" font-size="14" fill="#24272b" font-weight="600">Ticket</text><text x="248" y="237" font-size="14" fill="#24272b" font-weight="400">Keep edits when the page reloads.</text><text x="248" y="263" font-size="12" fill="#666d75" font-weight="600">Acceptance criteria</text><text x="248" y="290" font-size="14" fill="#24272b" font-weight="400">Restore the latest draft.</text><text x="248" y="317" font-size="14" fill="#24272b" font-weight="400">Keep edits made during a save.</text><text x="248" y="344" font-size="14" fill="#24272b" font-weight="400">Show a visible save state.</text><path d="M248 380h299" stroke="#dfe2e5"/><text x="248" y="409" font-size="12" fill="#666d75" font-weight="600">Current assignment</text><text x="248" y="436" font-size="14" fill="#24272b" font-weight="400">Gus · Builder · Attempt 1</text><text x="248" y="464" font-size="13" fill="#666d75" font-weight="400">Output ready for local review</text><text x="592" y="191" font-size="14" fill="#24272b" font-weight="600">Overview</text><text x="690" y="191" font-size="14" fill="#666d75" font-weight="400">Changes</text><text x="780" y="191" font-size="14" fill="#666d75" font-weight="400">Checks</text><text x="856" y="191" font-size="14" fill="#666d75" font-weight="400">Activity</text><path d="M585 207h585" stroke="#dfe2e5"/><text x="594" y="242" font-size="18" fill="#24272b" font-weight="600">The result</text><text x="594" y="271" font-size="14" fill="#24272b" font-weight="400">The draft survives reload and save overlap.</text><rect x="589" y="291" width="577" height="76" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="607" y="320" font-size="15" fill="#24272b" font-weight="600">3 changed files · +82 / -19</text><text x="607" y="345" font-size="13" fill="#666d75" font-weight="400">Open the local diff for revision 4</text><circle cx="1138" cy="329" r="15" fill="white" stroke="#dfe2e5"/><path d="M1133 329h10 l-4 -4 M1143 329l-4 4" stroke="#24272b" fill="none"/><rect x="589" y="381" width="577" height="76" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="607" y="410" font-size="15" fill="#24272b" font-weight="600">8 checks passed</text><text x="607" y="435" font-size="13" fill="#666d75" font-weight="400">Verified against revision 4 · bun test</text><circle cx="1138" cy="419" r="15" fill="white" stroke="#dfe2e5"/><path d="M1133 419h10 l-4 -4 M1143 419l-4 4" stroke="#24272b" fill="none"/><rect x="589" y="471" width="577" height="62" rx="8" fill="#f5f6f7" stroke="#dfe2e5"/><text x="607" y="497" font-size="14" fill="#24272b" font-weight="600">Terminal · Gus · Turn complete</text><text x="607" y="520" font-size="12" fill="#666d75" font-weight="400">Open output or attach to the retained session</text><circle cx="1138" cy="503" r="15" fill="white" stroke="#dfe2e5"/><path d="M1133 503h10 l-4 -4 M1143 503l-4 4" stroke="#24272b" fill="none"/><text x="235" y="569" font-size="12" fill="#666d75" font-weight="400">Ticket and output remain visible together. Closing a pane does not stop an agent.</text></g><text x="40" y="1496" font-size="17" fill="#24272b" font-weight="600">03 / Project manager</text><text x="40" y="1521" font-size="13" fill="#666d75" font-weight="400">Expose the queue and its next action. Separate controller state from the agent’s current turn.</text><g transform="translate(40 1539)"><rect x="0" y="0" width="1200" height="600" rx="12" fill="#ffffff" stroke="#dfe2e5"/><rect x="0" y="0" width="204" height="600" rx="12" fill="#f5f6f7" stroke="#dfe2e5"/><text x="26" y="33" font-size="19" fill="#24272b" font-weight="650">trellis</text><circle cx="24" cy="59" r="4" fill="#b4b9bf"/><circle cx="40" cy="59" r="4" fill="#c4c8cd"/><circle cx="56" cy="59" r="4" fill="#d2d5d9"/><text x="27" y="112" font-size="14" fill="#24272b" font-weight="400">Needs you</text><text x="27" y="154" font-size="14" fill="#24272b" font-weight="400">All tickets</text><text x="27" y="196" font-size="14" fill="#24272b" font-weight="400">Reviews</text><text x="27" y="238" font-size="14" fill="#24272b" font-weight="400">Flows</text><text x="27" y="305" font-size="11" fill="#666d75" font-weight="600">PROJECTS</text><text x="27" y="340" font-size="14" fill="#24272b" font-weight="600">Trellis</text><text x="42" y="377" font-size="14" fill="#24272b" font-weight="400">Tickets</text><rect x="22" y="389" width="170" height="32" rx="6" fill="#e5e8eb" stroke="none"/><text x="42" y="411" font-size="14" fill="#24272b" font-weight="600">Manager</text><text x="42" y="445" font-size="14" fill="#24272b" font-weight="400">Settings</text><path d="M20 540h164" stroke="#dfe2e5"/><text x="27" y="567" font-size="12" fill="#666d75" font-weight="400">Local runtime connected</text><text x="230" y="34" font-size="16" fill="#24272b" font-weight="600">Trellis / Manager</text><text x="230" y="59" font-size="12" fill="#666d75" font-weight="400">Automatic work enabled · 2 of 3 worker slots in use</text><path d="M204 78h996" stroke="#dfe2e5"/><circle cx="1100" cy="37" r="15" fill="white" stroke="#dfe2e5"/><path d="M1097 32v10 M1103 32v10" stroke="#24272b" stroke-width="2"/><circle cx="1148" cy="37" r="15" fill="white" stroke="#dfe2e5"/><circle cx="1143" cy="37" r="1.5"/><circle cx="1148" cy="37" r="1.5"/><circle cx="1153" cy="37" r="1.5"/><text x="233" y="118" font-size="23" fill="#24272b" font-weight="600">Ida is idle</text><text x="233" y="146" font-size="14" fill="#666d75" font-weight="400">One update is queued. The next delivery is due in 8 seconds.</text><rect x="230" y="169" width="588" height="169" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="248" y="199" font-size="14" fill="#24272b" font-weight="600">Next action</text><text x="248" y="228" font-size="16" fill="#24272b" font-weight="600">Review Gus’s output for TRL-121</text><text x="248" y="255" font-size="12" fill="#666d75" font-weight="400">Output accepted · Queued for Ida</text><path d="M248 274h552" stroke="#dfe2e5"/><text x="248" y="303" font-size="13" fill="#666d75" font-weight="400">Queued work stays here across a host restart.</text><rect x="835" y="169" width="335" height="169" rx="8" fill="#f5f6f7" stroke="#dfe2e5"/><text x="853" y="199" font-size="14" fill="#24272b" font-weight="600">Project controls</text><text x="853" y="231" font-size="13" fill="#24272b" font-weight="400">Pause stops new assignments.</text><text x="853" y="256" font-size="13" fill="#24272b" font-weight="400">Active workers can finish.</text><text x="853" y="299" font-size="13" fill="#666d75" font-weight="400">Agent and policy settings</text><circle cx="1137" cy="296" r="15" fill="white" stroke="#dfe2e5"/><path d="M1132 296h10 l-4 -4 M1142 296l-4 4" stroke="#24272b" fill="none"/><text x="236" y="379" font-size="14" fill="#24272b" font-weight="600">Active assignments</text><text x="998" y="379" font-size="13" fill="#666d75" font-weight="400">2 / 3 capacity</text><rect x="230" y="398" width="940" height="64" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="248" y="425" font-size="15" fill="#24272b" font-weight="600">TRL-126 · Draft conflict state</text><text x="248" y="447" font-size="12" fill="#666d75" font-weight="400">Gus · Builder</text><text x="931" y="434" font-size="13" fill="#666d75" font-weight="400">Working · 4 minutes</text><rect x="230" y="475" width="940" height="64" rx="8" fill="#ffffff" stroke="#dfe2e5"/><text x="248" y="502" font-size="15" fill="#24272b" font-weight="600">TRL-128 · Keyboard focus</text><text x="248" y="524" font-size="12" fill="#666d75" font-weight="400">Sol · Reviewer</text><text x="931" y="511" font-size="13" fill="#666d75" font-weight="400">Verifying · 1 minute</text><text x="235" y="579" font-size="12" fill="#666d75" font-weight="400">Controller healthy · Last reconciliation 3 seconds ago · No unresolved launches</text></g></g></svg>