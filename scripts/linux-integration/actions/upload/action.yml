name: Upload integration evidence
description: Upload one exact-run result or package artifact.
inputs:
  name:
    description: The immutable artifact name.
    required: true
  path:
    description: The result or package path.
    required: true
runs:
  using: composite
  steps:
    - name: Upload the artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 14
