name: Set up locked dependencies
description: Set up Bun and install the locked dependency tree.
inputs:
  bun-version:
    description: The exact Bun version.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile
